
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Agenda do Campus{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="cabecalho">
        <h1>Agenda de Eventos do Campus</h1>

        <nav>
            <a href="{% url 'eventos:index' %}">Início</a>
            <a href="{% url 'admin:index' %}">Administração</a>        
        </nav>
    </header>

    <main class="conteudo">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="rodape">
        <p>Agenda de Eventos do Campus</p>
    </footer>

    {% block scripts %}
    {% endblock %}
</body>
</html>
